components:
  parameters:
    EntityContext:
      name: x-bytecrunch-entity-id
      in: header
      required: false
      schema:
        type: string
  schemas:
    AccountSummary:
      type: object
      required:
        - id
        - email
        - displayName
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Agreement:
      type: object
      required:
        - id
        - tenantId
        - externalId
        - title
        - templateKey
        - templateVersion
        - status
        - revision
        - content
        - contentSha256
        - participants
        - parties
        - suggestions
        - documentComments
        - reviewRound
        - reviewAssignedTo
        - reviewHistory
        - createdByParticipantId
        - integrationContext
        - metadata
        - createdAt
        - updatedAt
        - executedAt
        - signatureNotificationsSentAt
        - invalidatedSignatures
      properties:
        id:
          type: string
        tenantId:
          type: string
        externalId:
          anyOf:
            - type: string
            - type: 'null'
        title:
          type: string
        templateKey:
          type: string
        templateVersion:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/AgreementStatus'
        revision:
          type: integer
          format: int32
        content:
          type: string
        contentSha256:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        parties:
          type: array
          items:
            $ref: '#/components/schemas/AgreementParty'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
        documentComments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentComment'
        reviewRound:
          type: integer
          format: int32
        reviewAssignedTo:
          anyOf:
            - $ref: '#/components/schemas/ReviewAssignee'
            - type: 'null'
        reviewHistory:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTurn'
        createdByParticipantId:
          anyOf:
            - type: string
            - type: 'null'
        integrationContext:
          anyOf:
            - $ref: '#/components/schemas/IntegrationContext'
            - type: 'null'
        metadata:
          type: object
          unevaluatedProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        executedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        signatureNotificationsSentAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        invalidatedSignatures:
          type: array
          items:
            $ref: '#/components/schemas/InvalidatedSignature'
    AgreementParty:
      type: object
      required:
        - id
        - role
        - entity
        - status
        - minimumSignatures
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/PartyRole'
        entity:
          $ref: '#/components/schemas/LegalEntity'
        status:
          $ref: '#/components/schemas/PartyStatus'
        minimumSignatures:
          type: integer
          format: int32
    AgreementRequirement:
      type: object
      required:
        - templateKey
      properties:
        templateKey:
          type: string
        minimumVersion:
          type: integer
          format: int32
    AgreementStatus:
      type: string
      enum:
        - draft
        - in_review
        - ready_for_signature
        - out_for_signature
        - partially_signed
        - executed
        - declined
        - voided
        - expired
    CreateAgreement:
      type: object
      required:
        - title
        - templateKey
      properties:
        title:
          type: string
        templateKey:
          type: string
        externalId:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CreateParticipant'
        parties:
          type: array
          items:
            $ref: '#/components/schemas/CreateAgreementParty'
        metadata:
          type: object
          unevaluatedProperties:
            type: string
    CreateAgreementParty:
      type: object
      required:
        - role
        - entity
        - participants
      properties:
        role:
          $ref: '#/components/schemas/PartyRole'
        entity:
          $ref: '#/components/schemas/CreateLegalEntity'
        minimumSignatures:
          type: integer
          format: int32
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CreateParticipant'
    CreateCustomerEntity:
      type: object
      required:
        - slug
        - legalName
      properties:
        slug:
          type: string
        legalName:
          type: string
        businessAddress:
          type: string
        registrationNumber:
          type: string
        jurisdiction:
          type: string
    CreateIntegration:
      type: object
      required:
        - key
        - name
        - mappingStrategy
        - allowedRedirectUris
      properties:
        key:
          type: string
        name:
          type: string
        mappingStrategy:
          type: string
          enum:
            - host_asserted
            - shared_oidc
            - account_linking
        allowedRedirectUris:
          type: array
          items:
            type: string
            format: uri
        allowedOrigins:
          type: array
          items:
            type: string
            format: uri
    CreateIntegrationSession:
      type: object
      required:
        - integrationKey
        - subject
        - email
        - templateKey
        - returnUrl
      properties:
        integrationKey:
          type: string
        subject:
          type: string
        email:
          type: string
        displayName:
          type: string
        templateKey:
          type: string
        title:
          type: string
        returnUrl:
          type: string
          format: uri
        metadata:
          type: object
          unevaluatedProperties:
            type: string
    CreateLegalEntity:
      type: object
      properties:
        externalId:
          type: string
        legalName:
          type: string
        businessAddress:
          type: string
        registrationNumber:
          type: string
        jurisdiction:
          type: string
    CreateParticipant:
      type: object
      required:
        - email
        - role
        - required
      properties:
        email:
          type: string
        name:
          type: string
        role:
