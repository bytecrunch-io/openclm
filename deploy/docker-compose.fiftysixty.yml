name: bytecrunch-contracts-fiftysixty

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${FIFTYSIXTY_ENV_FILE:-.env.fiftysixty}
    environment:
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: contracts
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts -d contracts"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${FIFTYSIXTY_ENV_FILE:-.env.fiftysixty}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - artifact-data:/var/lib/bytecrunch/artifacts
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  artifact-data:
