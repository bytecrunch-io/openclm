name: bytecrunch-contracts

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
      POSTGRES_DB: contracts
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts -d contracts"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: contracts
      KC_DB_PASSWORD: contracts
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/bytecrunch-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      NODE_ENV: development
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://contracts:contracts@postgres:5432/contracts
      AUTH_MODE: oidc
      TENANT_LEGAL_NAME: ${TENANT_LEGAL_NAME:-ByteCrunch ApS}
      TENANT_BUSINESS_ADDRESS: ${TENANT_BUSINESS_ADDRESS:-}
      OIDC_ISSUER_URL: http://localhost:8080/realms/bytecrunch
      OIDC_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/bytecrunch
      OIDC_CLIENT_ID: bytecrunch-contracts
      OIDC_CLIENT_SECRET: local-development-secret
      OIDC_REDIRECT_URI: http://localhost:3001/auth/callback
      SESSION_SECRET: local-compose-session-secret-change-in-production
      WEBHOOK_SIGNING_SECRET: local-webhook-secret
      SIGNING_MODE: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
